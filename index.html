<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Łapanie spadających przedmiotów</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #app {
            width: 100%;
            height: 100%;
        }

        #app canvas {
            display: block;
        }

        .layout {
            position: absolute;
            inset: 0;

            color: #fff;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.6);
        }

        .overlay__panel {
            background: #1e272e;
            color: #fff;
            padding: 24px 32px;
            border-radius: 8px;
            text-align: center;
        }

        .overlay__panel button {
            margin-top: 12px;
            padding: 8px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <div class="layout">
        <span id="score">0</span>
        <span id="lives">3</span>
        <span id="level">Poziom 1</span>
    </div>
    <div id="level-transition" class="overlay">
        <div class="overlay__panel">
            <p id="level-transition-message"></p>
            <button id="level-transition-continue" type="button">Dalej</button>
        </div>
    </div>
    <div id="game-over" class="overlay">
        <div class="overlay__panel">
            <p>Koniec gry</p>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
