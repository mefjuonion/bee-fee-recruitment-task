<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bee-fee recruitment task.</title>
    <style>
        html {
            font-size: calc(100vw / 100);
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: sans-serif;
        }

        #app {
            width: 100%;
            height: 100%;
        }

        #app canvas {
            display: block;
        }

        .layout {
            position: absolute;
            inset: 0;

            display: flex;
            place-content: center;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            background: rgba(0, 0, 0, 0.6);
        }

        .overlay__panel {
            background: #1e272e;
            color: #fff;
            padding: 24px 32px;
            border-radius: 8px;
            text-align: center;
            justify-items: center;
        }

        .overlay__panel button {
            margin-top: 12px;
            padding: 8px 20px;
            font-size: clamp(12px, 1rem, 22px);
            cursor: pointer;
        }

        .layout > span {
            background: black;
            font-size: clamp(18px, 1.875rem, 42px);
            color: white;
            padding: 1% 2%;
            align-self: flex-end;
        }

        #score {
            background-color: rgba(9, 58, 0, 0.649);
        }

        .overlay__panel h1 {
            margin: 0 0 12px;
            font-size: clamp(18px, 1.625rem, 34px);
        }

        .overlay__panel h3 {
            font-size: clamp(14px, 1rem, 20px);
        }

        .overlay__panel p {
            margin: 0;
            max-width: 320px;
            line-height: 1.4;
            font-size: clamp(12px, 1rem, 22px);
        }
    </style>
</head>
<body>
    <div class="layout">
        <span id="score">10</span>
        <span class="layout__level" id="level">Poziom 1</span>
    </div>

    <div id="app"></div>

    <div id="welcome-page" class="overlay" style="visibility: visible;">
        <div class="overlay__panel">
            <h1>Trening zręczności przed poszukiwaniem puszek kaucyjnych.</h1>
            <h3>Sterowanie strzałkami. Zbieraj jedzenie, lezy gdzie bądź.</h3>
            <p>By CEO styrtasiepali</p>
            <button id="welcome-start-button" type="button">Zagraj</button>
        </div>
    </div>

    <div id="level-transition" class="overlay">
        <div class="overlay__panel">
            <p id="level-transition-message"></p>
            <button id="level-transition-continue" type="button">Dalej</button>
        </div>
    </div>

    <div id="game-over" class="overlay">
        <div class="overlay__panel">
            <p>Koniec gry</p>
            <p style="margin-top: 8px;">Osiągnięty poziom: <strong id="game-over-level">Poziom 1</strong></p>
            <button id="game-over-restart" type="button">Zagraj ponownie</button>
        </div>
    </div>

    <div id="game-won" class="overlay">
        <div class="overlay__panel">
            <p>Wygrałeś!</p>
            <p style="margin-top: 8px;">Zdobyte punkty: <strong id="game-won-score">0</strong></p>
            <button id="game-won-restart" type="button">Zagraj ponownie</button>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
